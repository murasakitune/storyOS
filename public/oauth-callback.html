<!doctype html>
<html lang="ja">
  <head><meta charset="utf-8"><title>Story OS Google Drive接続</title></head>
  <body>
    <p>Story OSへ戻ります…</p>
    <script>
      const values = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
      if (window.opener) window.opener.postMessage({ type: "storyos-google-oauth", ...values }, "*");
      window.close();
    </script>
  </body>
</html>
